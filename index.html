function plan(oi,cid){
  const o=S.outlets[oi],cin=x=>cid?x.c===cid:!x.c;
  const its=o.items.filter(cin).sort((a,b)=>a.date.localeCompare(b.date)).map(i=>({i,full:iv(i),left:iv(i)}));
  const ps=S.pay.filter(p=>p.o===oi&&cin(p)).sort((a,b)=>a.date.localeCompare(b.date));
  // Pembayaran dengan titipan terpilih: dialokasikan ke titipan itu dulu; kelebihan/tanpa pilihan: paling lama lebih dulu
  const res=ps.map(p=>{let rem=p.amt;const L=[];
    const take=t=>{const u=Math.min(rem,t.left);if(u>0){L.push({i:t.i,u,full:t.full,bf:t.full-t.left,rest:t.left-u});t.left-=u;rem-=u}};
    if(p.its&&p.its.length)its.forEach(t=>{if(rem>0&&t.left>0&&p.its.includes(t.i.id))take(t)});
    its.forEach(t=>{if(rem>0&&t.left>0)take(t)});
    L.sort((a,b)=>a.i.date.localeCompare(b.i.date));
    return{p,L,lebih:rem,oi,cid}});
  return{its,res};
}

    if(p!==d.pin2){OB.err='Ulangi PIN dengan sama persis';obRender();return}
    OB.wait=true;obRender();
    let r=null,j=null;
    try{r=await fetch('/api/data',{method:'POST',cache:'no-store',headers:{'content-type':'application/json',authorization:'Bearer '+p},body:jk({data})});try{j=await r.json()}catch(e){}}catch(e){}

    const z=256,sc=Math.min(z/im.width,z/im.height,1),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    const cx=c.getContext('2d');cx.drawImage(im,0,0,c.width,c.height);unwhite(cx,c.width,c.height);S.logo=c.toDataURL('image/png');save();msg='Logo disimpan';render()};
    im.onerror=()=>{msg='File gambar tidak bisa dibaca';render()};im.src=r.result};r.readAsDataURL(f);
});
async function pull(){
  if(!S||dirty||busy||document.hidden||document.querySelector('.sh.on'))return;
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  let res;try{res=await api('GET',null,'?since='+REV)}catch(e){return}
  if(dirty||busy||!res.r.ok||!res.j||res.j.same||!Number.isInteger(res.j.rev)||res.j.rev<=REV||!valid(res.j.data))return;
  S=res.j.data;norm();REV=res.j.rev;setBase(jk(S));cache();msg='';render();setStat('Diperbarui');
}
window.addEventListener('online',push);setInterval(push,20000);setInterval(pull,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){push();pull()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='pin'){const b=$('[data-a=pin]');if(b)b.click()}else if(e.target.id==='o_pin2'){const b=$('[data-a=ob-finish]');if(b)b.click()}});
boot();
