  else if(a==='delbh'){const bb=S.bahan.find(x=>x.id===b.dataset.id);if(!bb||!confirm('Hapus bahan '+bb.nama+' beserta riwayatnya?'))return;S.bahan=S.bahan.filter(x=>x.id!==bb.id);S.mov=S.mov.filter(x=>x.b!==bb.id);save();msg='Bahan dihapus';render()}
  else if(a==='edito'){const o=S.outlets[+b.dataset.o],n=prompt('Nama outlet',o.name);if(n&&n.trim()){o.name=n.trim().slice(0,40);save();msg='Nama outlet diperbarui';render()}}
  else if(a==='addo'){const n=prompt('Nama outlet (mis. Toko Maju)');if(n&&n.trim()){S.outlets.push({name:n.trim().slice(0,40),items:[]});save();render()}}
  else if(a==='del'){if(!confirm('Hapus titipan ini?'))return;S.outlets[b.dataset.o].items.splice(b.dataset.i,1);save();render()}
  else if(a==='copyrep'){msg=(await cp(report()))?'Tagihan tersalin':'Gagal menyalin';render()}
  else if(a==='backup'){msg=(await cp(JSON.stringify(S)))?'Cadangan tersalin':'Gagal menyalin';if(msg==='Cadangan tersalin'){S.backupAt=Date.now();save()}render()}
  else if(a==='savenm'){S.nama=$('#nm').value.trim()||'KonsiKu';S.owner=$('#ow').value.trim();S.wa=$('#wa2').value.trim();S.kota=$('#kt').value.trim();S.bank=$('#bk').value.trim();save();msg='Profil usaha disimpan';render()}
  else if(a==='savepk'){S.produk=parsePk($('#pk').value);save();msg='Daftar produk disimpan';render()}
  else if(a==='rmdemo'){if(confirm('Hapus semua data contoh? Anda akan kembali ke layar awal.')){S={outlets:[{name:'Contoh',items:[]}],pay:[],bahan:[],mov:[],rek:[]};save();render()}}
  else if(a==='rmlogo'){delete S.logo;save();msg='Logo dihapus';render()}
  else if(a==='bin'||a==='bout'||a==='bnew'||a==='eb'||a==='bop')openG(a==='bin'?'in':a==='bout'?'out':a==='bop'?'opname':'master',b.dataset.id)
  else if(a==='kst')kartu(b.dataset.id)
  else if(a==='s2close')$('#sh2').classList.remove('on');
  else if(a==='s2save'){if(GS.m==='pay')saveP();else if(GS.m==='bya')saveB();else saveG()}
  else if(a==='emv'){const x=S.mov.find(y=>y.id===b.dataset.id);if(x)openG(x.t,x.b,x.id)}
  else if(a==='delmv'){if(!confirm('Hapus riwayat ini?'))return;S.mov=S.mov.filter(x=>x.id!==b.dataset.id);save();render()}
  else if(a==='delb'){if(!GS.w){GS.w=1;b.textContent='Yakin hapus?';return}S.bahan=S.bahan.filter(x=>x.id!==GS.id);S.mov=S.mov.filter(x=>x.b!==GS.id);save();$('#sh2').classList.remove('on');render()}
  else if(a==='copyb'){msg=(await cp(btext()))?'Rekap tersalin':'Gagal menyalin';render()}
  else if(a==='per'){per=b.dataset.p;render()}
  else if(a==='later'){S.backupAt=Date.now();save();render()}
  else if(a==='restore'){try{const d=JSON.parse($('#rs').value);if(!valid(d))throw 0;if(!confirm('Timpa semua data dengan cadangan ini?'))return;S=d;norm();save();msg='Data dipulihkan'}catch(x){msg='Teks cadangan tidak valid'}render()}
  else if(a==='reset'){if((prompt('Semua data (termasuk data online Anda) akan dihapus dan tidak bisa dikembalikan.\nKetik HAPUS untuk melanjutkan.')||'').trim()==='HAPUS'){S={outlets:[{name:'Contoh',items:[]}],pay:[],bahan:[],mov:[],rek:[]};save();render()}}
  else if(a==='tutup')closeP(+b.dataset.o);
  else if(a==='copyc'){const c=CL().find(x=>x.p.id===b.dataset.id);msg=c&&(await cp(ctext(c)))?'Rekap tersalin':'Gagal menyalin';render()}
  else if(a==='copyall'){msg=(await cp(CL().map(ctext).join('\n----------\n')))?'Semua rekap tersalin':'Gagal menyalin';render()}
  else if(a==='reopen'){const r=(S.rek||[]).find(x=>x.id===b.dataset.id);if(!r)return;if(!confirm('Buka lagi tagihan ini? Titipan dan pembayarannya digabung kembali ke tagihan berjalan outlet tersebut.'))return;S.outlets[r.o].items.forEach(i=>{if(i.c===r.id)delete i.c});S.pay.forEach(x=>{if(x.c===r.id)delete x.c});S.rek=S.rek.filter(x=>x.id!==r.id);save();msg='Tagihan dibuka lagi';render()}
  else if(a==='copyrek'){const r=(S.rek||[]).find(x=>x.id===b.dataset.id);msg=r&&(await cp(rtext(r)))?'Rekap tersalin':'Gagal menyalin';render()}
  else if(a==='addbya')openB();
  else if(a==='bedit')openB(b.dataset.id);
  else if(a==='bdel'){if(!confirm('Hapus catatan biaya ini?'))return;S.biaya=(S.biaya||[]).filter(x=>x.id!==b.dataset.id);save();msg='Biaya dihapus';render()}
  else if(a==='pedit'){const x=S.pay.find(y=>y.id===b.dataset.id);if(x)openP(x.o,false,x.id)}
  else if(a==='addpay')openP(+b.dataset.o||0,b.dataset.f==='1');
  else if(a==='pdel'){if(!confirm('Hapus pembayaran ini? Sisa tagihan akan bertambah lagi.'))return;S.pay=S.pay.filter(x=>x.id!==b.dataset.id);save();msg='Pembayaran dihapus';render()}
  else if(a==='pin'){const v=$('#pin').value;if(!v)return;await sepAccount(v);PIN=v;LS.s('rr77pin',v);boot()}
  else if(a==='savefile'){const nm=(S.nama||'KonsiKu').replace(/[^\w\-]+/g,'-').replace(/^-+|-+$/g,'')||'KonsiKu';
    try{const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download=`konsiku-${nm}-${iso(new Date())}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);S.backupAt=Date.now();save();msg='File cadangan disimpan (cek folder Unduhan)'}catch(x){msg='Gagal menyimpan file'}render()}
  else if(a==='chpin'){
    const o=$('#cp0').value,n=$('#cp1').value,n2=$('#cp2').value,er=t=>{$('#cpe').textContent=t};
    if(o!==PIN)return er('PIN lama tidak cocok');
    if(n.length<6||/\s/.test(n))return er('PIN baru minimal 6 karakter, tanpa spasi');
    if(n===o)return er('PIN baru harus berbeda dari PIN lama');
    if(n!==n2)return er('Ulangi PIN baru dengan sama persis');
    if(busy)return er('Sedang menyimpan data, coba lagi sebentar');
    b.disabled=true;er('Menyimpan…');let r=null,j=null;
    try{r=await fetch('/api/data',{method:'PATCH',cache:'no-store',headers:{'content-type':'application/json',authorization:'Bearer '+o},body:jk({newPin:n})});try{j=await r.json()}catch(x){}}catch(x){}
    if(r&&r.ok){PIN=n;LS.s('rr77pin',n);LS.s('rr77aid',await aidOf(n));msg='PIN berhasil diganti. Gunakan PIN baru saat masuk.';render()}
    else{b.disabled=false;er((j&&j.error)||'Tidak bisa terhubung. Periksa internet.')}}
  else if(a==='retry')boot();
  else if(a==='logout'){if(!confirm('Keluar dan hapus salinan data di perangkat ini? Data online Anda tetap aman.'+(dirty?' PERHATIAN: ada perubahan yang belum tersimpan online!':'')))return;['rr77pin','rr77v2','rr77rev','rr77dirty','rr77lost','rr77base','rr77aid','rr77logo','rr77nama'].forEach(k=>LS.d(k));PIN='';S=null;dirty=false;lock()}
  else if(a==='copylost'){msg=(await cp(LS.g('rr77lost')||''))?'Salinan tersalin':'Gagal menyalin';render()}
  else if(a==='droplost'){LS.d('rr77lost');render()}
});
document.addEventListener('change',e=>{
  if(GS.m==='pay'&&e.target.dataset&&e.target.dataset.pi){const id=e.target.dataset.pi;GS.sel=GS.sel||[];if(e.target.checked){if(!GS.sel.includes(id))GS.sel.push(id)}else GS.sel=GS.sel.filter(x=>x!==id);GS.auto=0;paySel();return}
  if(GS.m==='pay'&&e.target.id==='p1'){GS.sel=[];payList();payPrev();return}
  if(e.target.id==='rsf'){const f=e.target.files[0];e.target.value='';if(!f)return;
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!valid(d))throw 0;
      if(!confirm('Timpa semua data akun ini dengan isi file "'+f.name+'"? Tidak bisa dibatalkan.')){return}
      d.setup=true;S=d;norm();save();msg='Data dipulihkan dari file';render()}catch(x){msg='File cadangan tidak valid';render()}};
    r.onerror=()=>{msg='File tidak bisa dibaca';render()};r.readAsText(f);return}
  if(e.target.id!=='lg')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const z=256,sc=Math.min(z/im.width,z/im.height,1),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    const cx=c.getContext('2d');cx.drawImage(im,0,0,c.width,c.height);unwhite(cx,c.width,c.height);S.logo=c.toDataURL('image/png');save();msg='Logo disimpan';render()};
    im.onerror=()=>{msg='File gambar tidak bisa dibaca';render()};im.src=r.result};r.readAsDataURL(f);
});
async function pull(){
  if(!S||dirty||busy||document.hidden||document.querySelector('.sh.on'))return;
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
  let res;try{res=await api('GET',null,'?since='+REV)}catch(e){return}
  if(dirty||busy||!res.r.ok||!res.j||res.j.same||!Number.isInteger(res.j.rev)||res.j.rev<=REV||!valid(res.j.data))return;
  S=res.j.data;norm();REV=res.j.rev;setBase(jk(S));cache();msg='';render();setStat('Diperbarui');
}
window.addEventListener('online',push);setInterval(push,20000);setInterval(pull,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){push();pull()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='pin'){const b=$('[data-a=pin]');if(b)b.click()}else if(e.target.id==='o_pin2'){const b=$('[data-a=ob-finish]');if(b)b.click()}});
boot();
</script>
